<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZLH 💖 ZSY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 10%, #fce4ec 0%, #f8bbd0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
            overflow-x: hidden;
        }
        .card {
            max-width: 660px;
            width: 100%;
            background: rgba(255, 240, 245, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 64px 64px 48px 48px;
            padding: 24px 24px 36px;
            box-shadow: 0 30px 80px rgba(180, 60, 100, 0.25), 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 200, 210, 0.6);
            position: relative;
            z-index: 1;
        }
        .header { text-align: center; margin-bottom: 18px; }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #7a2a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            text-shadow: 0 4px 18px rgba(200, 70, 110, 0.15);
        }
        .header h1 i { color: #d63e6b; animation: pulse-heart 1.8s infinite; }
        .photo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 8px auto;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
        }
        .photo-container {
            width: 100%;
            height: 100%;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 16px 48px rgba(160, 50, 80, 0.25);
            background: #ffeef2;
            position: relative;
            cursor: pointer;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .photo-badge {
            position: absolute;
            bottom: 16px;
            right: 18px;
            background: rgba(255, 235, 240, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 22px 8px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #7a2a4a;
            border: 1px solid rgba(255, 200, 210, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(180, 60, 100, 0.12);
            z-index: 3;
            white-space: nowrap;
        }
        .photo-badge i { color: #d63e6b; }
        .quote-box {
            width: 100%;
            max-width: 520px;
            margin: 22px auto 0;
            background: rgba(255, 240, 245, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 18px 26px;
            border: 1px solid rgba(255, 200, 210, 0.5);
            box-shadow: inset 0 2px 20px rgba(255, 200, 220, 0.2);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: 0.25s;
        }
        .quote-box i {
            color: #d63e6b;
            font-size: 1.6rem;
            margin-right: 14px;
            animation: pulse-heart 1.8s infinite;
        }
        .quote-box .quote-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #4a1f33;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        .quote-box .quote-text .highlight {
            background: linear-gradient(120deg, #f7a1b8, #f28b9e);
            padding: 2px 16px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            margin: 0 4px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }
        .progress-area {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 400px;
        }
        .progress-area span {
            font-size: 0.9rem;
            font-weight: 500;
            color: #7a2a4a;
            min-width: 48px;
            text-align: center;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(200, 120, 140, 0.25);
            border-radius: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e8436e, #f28b9e);
            border-radius: 12px;
            transition: width 0.3s ease;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            background: rgba(255, 235, 240, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 200, 210, 0.5);
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #7a2a4a;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(160, 60, 90, 0.10);
        }
        .ctrl-btn i { color: #d63e6b; font-size: 1.0rem; }
        .ctrl-btn:hover {
            background: rgba(255, 220, 230, 0.9);
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(180, 60, 100, 0.2);
            border-color: #f5a0b5;
        }
        .ctrl-btn:active { transform: scale(0.96); }
        .ctrl-btn.primary {
            background: #e8436e;
            border-color: #f27a9a;
            color: white;
            box-shadow: 0 8px 28px rgba(220, 60, 100, 0.3);
        }
        .ctrl-btn.primary i { color: white; }
        .ctrl-btn.primary:hover {
            background: #d63b63;
            box-shadow: 0 12px 36px rgba(200, 50, 80, 0.4);
        }
        .music-btn {
            background: rgba(255, 235, 240, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 200, 210, 0.5);
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #7a2a4a;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(160, 60, 90, 0.10);
        }
        .music-btn:hover {
            background: rgba(255, 220, 230, 0.9);
            transform: translateY(-2px);
        }
        .music-btn i { color: #d63e6b; font-size: 1.0rem; }
        #heartContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .floating-heart {
            position: fixed;
            pointer-events: none;
            font-size: 28px;
            z-index: 9999;
            opacity: 1;
            animation: heartPop 0.8s ease-out forwards;
            text-shadow: 0 0 30px rgba(214, 62, 107, 0.4);
        }
        @keyframes heartPop {
            0% { transform: scale(0.3) rotate(0deg); opacity: 0; }
            15% { transform: scale(1.1) rotate(10deg); opacity: 1; }
            30% { transform: scale(1) rotate(-5deg); opacity: 1; }
            60% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.8) rotate(20deg); opacity: 0; }
        }
        @media (max-width: 600px) {
            .card { padding: 16px 14px 28px; border-radius: 40px; }
            .header h1 { font-size: 1.8rem; }
            .photo-wrapper { max-width: 100%; }
            .photo-container { border-radius: 28px; }
            .quote-box { padding: 14px 18px; min-height: 70px; }
            .quote-box .quote-text { font-size: 1.0rem; }
            .ctrl-btn { padding: 10px 18px; font-size: 0.85rem; }
            .photo-badge { font-size: 0.75rem; padding: 4px 16px; bottom: 12px; right: 14px; }
        }
        @media (max-width: 420px) {
            .header h1 { font-size: 1.5rem; gap: 8px; }
            .quote-box .quote-text { font-size: 0.9rem; }
            .ctrl-btn { padding: 8px 14px; font-size: 0.8rem; gap: 6px; }
            .photo-container { border-radius: 20px; }
        }
        @keyframes pulse-heart {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        .photo-container img { animation: fadeIn 0.7s ease; }
        @keyframes fadeIn {
            0% { opacity: 0.3; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1); }
        }
        .photo-container .placeholder-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #fcd8e2, #fbc4d2);
            color: #b14b6e;
            font-size: 4rem;
        }

        /* ===== 覆盖层样式 ===== */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #fce4ec 0%, #f8bbd0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }
        .overlay-content {
            text-align: center;
            padding: 20px;
            animation: float-up 1.2s ease-out;
        }
        @keyframes float-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .big-heart-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }
        .big-heart {
            font-size: 5rem;
            color: #d63e6b;
            animation: pulse-heart 1.5s infinite;
            position: relative;
            z-index: 2;
        }
        .heart-pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(214, 62, 107, 0.15);
            transform: translate(-50%, -50%) scale(1);
            animation: ring-pulse 2s infinite ease-out;
            z-index: 1;
        }
        @keyframes ring-pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }
        .title {
            color: #7a2a4a;
            font-size: 2.8rem;
            font-weight: 700;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        .sub {
            color: #ff1744;
            font-size: 2.0rem;
            font-weight: 700;
            margin-top: 6px;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(255, 23, 68, 0.3);
            animation: heartbeat-text 1.2s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes heartbeat-text {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 23, 68, 0.3); }
            14% { transform: scale(1.25); text-shadow: 0 0 60px rgba(255, 23, 68, 0.7), 0 0 100px rgba(255, 23, 68, 0.3); }
            28% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 23, 68, 0.3); }
            42% { transform: scale(1.2); text-shadow: 0 0 50px rgba(255, 23, 68, 0.6), 0 0 80px rgba(255, 23, 68, 0.2); }
            56% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 23, 68, 0.3); }
            100% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 23, 68, 0.3); }
        }

        /* ===== 进度条样式 ===== */
        .loading-progress {
            margin-top: 30px;
            width: 220px;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(200, 120, 140, 0.25);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-overlay {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e8436e, #f28b9e);
            border-radius: 4px;
            transition: width 0.1s linear;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #7a2a4a;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* ===== 准备弹窗 ===== */
        #readyModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
        }
        #readyModal.show {
            display: flex;
        }
        .modal-box {
            background: rgba(255, 240, 245, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 48px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(180, 60, 100, 0.3);
            border: 1px solid rgba(255, 200, 210, 0.4);
            animation: float-up 0.6s ease-out;
        }
        .modal-box .modal-icon {
            font-size: 3.5rem;
            color: #d63e6b;
            margin-bottom: 12px;
            animation: pulse-heart 1.5s infinite;
        }
        .modal-box h2 {
            color: #7a2a4a;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal-box p {
            color: #7a2a4a;
            font-size: 1.0rem;
            opacity: 0.8;
            margin-bottom: 24px;
        }
        .modal-btns {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .modal-btn {
            padding: 12px 36px;
            border-radius: 60px;
            font-size: 1.0rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .modal-btn.primary {
            background: #e8436e;
            color: white;
            box-shadow: 0 8px 28px rgba(220, 60, 100, 0.3);
        }
        .modal-btn.primary:hover {
            background: #d63b63;
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(200, 50, 80, 0.4);
        }
        .modal-btn.secondary {
            background: rgba(200, 120, 140, 0.15);
            color: #7a2a4a;
            border: 1px solid rgba(200, 120, 140, 0.2);
        }
        .modal-btn.secondary:hover {
            background: rgba(200, 120, 140, 0.25);
            transform: translateY(-2px);
        }
        @media (max-width: 600px) {
            .modal-box { padding: 32px 24px; }
            .modal-box h2 { font-size: 1.5rem; }
            .modal-btn { padding: 10px 28px; font-size: 0.9rem; }
        }

        /* ===== 加载状态 ===== */
        .photo-container.loading::after {
            content: '💕 加载中...';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7a2a4a;
            font-size: 1.2rem;
            background: rgba(255, 240, 245, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 200, 210, 0.5);
            z-index: 2;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(180, 60, 100, 0.12);
            animation: pulse-heart 1.2s infinite;
        }

        /* ===== 录音按钮播放状态 ===== */
        .ctrl-btn.recording {
            background: #e8436e;
            color: white;
            animation: pulse-recording 1.2s infinite;
        }
        .ctrl-btn.recording i {
            color: white;
        }
        @keyframes pulse-recording {
            0% { box-shadow: 0 0 0 0 rgba(232, 67, 110, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(232, 67, 110, 0); }
            100% { box-shadow: 0 0 0 0 rgba(232, 67, 110, 0); }
        }

        /* ===== 调试信息样式 ===== */
        #debugInfo {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            font-size: 12px;
            padding: 10px;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 99999;
            font-family: monospace;
            display: none;
            word-break: break-all;
        }
        #debugInfo.show {
            display: block;
        }
    </style>
</head>
<body>

<!-- ===== 调试信息 ===== -->
<div id="debugInfo"></div>

<!-- ===== 启动覆盖层 ===== -->
<div id="startOverlay">
    <div class="overlay-content">
        <div class="big-heart-wrapper">
            <i class="fas fa-heart big-heart"></i>
            <div class="heart-pulse-ring"></div>
        </div>
        <div class="title">💖 送给 ZSY</div>
        <div class="sub">I LOVE YOU FOREVER</div>
        <div class="loading-progress" id="loadingProgress">
            <div class="progress-track">
                <div class="progress-bar-overlay" id="progressBarOverlay" style="width: 0%;"></div>
            </div>
            <span class="progress-text" id="progressText">加载中 0%</span>
        </div>
    </div>
</div>

<!-- ===== 准备弹窗 ===== -->
<div id="readyModal">
    <div class="modal-box">
        <div class="modal-icon">💝</div>
        <h2>准备好了吗？</h2>
        <p>我已经准备好把这份心意 💖 全部给你</p>
        <div class="modal-btns">
            <button class="modal-btn primary" id="readyYes">✨ 准备好了</button>
            <button class="modal-btn secondary" id="readyNo">⏳ 再等等</button>
        </div>
    </div>
</div>

<!-- ===== 主要内容 ===== -->
<div class="card" id="mainCard" style="display:none;">
    <div class="header">
        <h1>
            <i class="fas fa-heart"></i>
            ZSY · 我爱你
            <i class="fas fa-heart" style="animation-delay: 0.4s;"></i>
        </h1>
    </div>

    <div class="photo-wrapper">
        <div class="photo-container" id="photoContainer">
            <img id="mainPhoto" src="https://cdn.jsdelivr.net/gh/zlh-zsy/love/zsy/1.jpg" alt="照片">
            <div class="photo-badge" id="photoBadge">
                <i class="fas fa-heart"></i> <span id="numberDisplay">1 / 52</span>
            </div>
        </div>
    </div>

    <div class="quote-box" id="quoteBox">
        <i class="fas fa-heart"></i>
        <span class="quote-text" id="quoteText">
            点击 <span class="highlight">播放</span> 感受我的心意 💕
        </span>
    </div>

    <div class="controls">
        <div class="progress-area">
            <span id="progressLabel">1/52</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
        </div>

        <div class="btn-group">
            <button class="ctrl-btn" id="prevBtn"><i class="fas fa-chevron-left"></i> 上一张</button>
            <button class="ctrl-btn" id="nextBtn">下一张 <i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="btn-group" style="margin-top: 4px;">
            <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-random"></i> 随机</button>
            <button class="ctrl-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> 第一张</button>
            <button class="music-btn" id="musicToggle"><i class="fas fa-music"></i> <span id="musicLabel">加载中...</span></button>
            <button class="ctrl-btn" id="voiceBtn"><i class="fas fa-microphone"></i> <span id="voiceLabel">听录音</span></button>
        </div>
    </div>
</div>

<div id="heartContainer"></div>

<!-- ===== 音频资源 ===== -->
<audio id="bgMusic" loop preload="auto">
    <source src="manman.mp3" type="audio/mpeg">
</audio>

<audio id="voiceRecord" preload="auto">
    <source src="zsy.m4a" type="audio/mp4">
    <source src="zsy.mp3" type="audio/mpeg">
</audio>

<script>
    (function() {
        "use strict";

        // ===== 音量常量 =====
        const MUSIC_VOLUME_NORMAL = 0.35;
        const MUSIC_VOLUME_LOW = 0.08;

        // ===== DOM 引用 =====
        const mainPhoto = document.getElementById('mainPhoto');
        const numberDisplay = document.getElementById('numberDisplay');
        const quoteText = document.getElementById('quoteText');
        const progressFill = document.getElementById('progressFill');
        const progressLabel = document.getElementById('progressLabel');
        const photoContainer = document.getElementById('photoContainer');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const resetBtn = document.getElementById('resetBtn');
        const musicToggle = document.getElementById('musicToggle');
        const musicLabel = document.getElementById('musicLabel');
        const bgMusic = document.getElementById('bgMusic');

        const startOverlay = document.getElementById('startOverlay');
        const progressBarOverlay = document.getElementById('progressBarOverlay');
        const progressText = document.getElementById('progressText');
        const readyModal = document.getElementById('readyModal');
        const readyYes = document.getElementById('readyYes');
        const readyNo = document.getElementById('readyNo');
        const mainCard = document.getElementById('mainCard');

        const voiceRecord = document.getElementById('voiceRecord');
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceLabel = document.getElementById('voiceLabel');

        // ===== 状态变量 =====
        let currentIndex = 0;
        let isMusicPlaying = false;
        let isStarted = false;
        let isVoicePlaying = false;
        let autoPlayInterval = null;
        let progressInterval = null;
        let isWebAudioReady = false;
        let audioCtx = null;
        let gainNode = null;
        let musicSource = null;

        const TOTAL = 52;
        const LOADING_DURATION = 10000;
        const AUTO_INTERVAL_MS = 5000;

        // ===== 工具函数 =====
        const debugEl = document.getElementById('debugInfo');
        let debugLogs = [];

        function debugLog(msg) {
            const timestamp = new Date().toLocaleTimeString();

            debugEl.innerHTML = debugLogs.join('\n');
            debugEl.scrollTop = debugEl.scrollHeight;
            console.log(logMsg);
        }

        let debugToggleCount = 0;
        document.addEventListener('dblclick', function() {
            debugToggleCount++;
            if (debugToggleCount >= 3) {
                debugEl.classList.toggle('show');
                debugToggleCount = 0;
            }
            setTimeout(() => { debugToggleCount = 0; }, 3000);
        });

        function getPhotoUrl(index) {
            return `https://cdn.jsdelivr.net/gh/zlh-zsy/love/zsy/${index + 1}.jpg`;
        }

        const loveMessages = [

        while (loveMessages.length < TOTAL) {

        // ============================================================
        // ===== Web Audio API（优化版 - 延迟初始化） =====
        // ============================================================
        function initWebAudio() {
            if (isWebAudioReady) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioCtx.createGain();
                gainNode.gain.value = MUSIC_VOLUME_NORMAL;
                gainNode.connect(audioCtx.destination);
                isWebAudioReady = true;
                debugLog('✅ Web Audio 初始化成功');
            } catch (e) {
                debugLog('⚠️ Web Audio 不可用，使用 HTML5 volume');
            }
        }

        function connectMusicToWebAudio() {
            if (!isWebAudioReady || musicSource) return;
            try {
                musicSource = audioCtx.createMediaElementSource(bgMusic);
                musicSource.connect(gainNode);
                debugLog('✅ 音乐已连接 Web Audio');
            } catch (e) {
                debugLog('⚠️ 连接失败: ' + e.message);
            }
        }

        function setMusicVolume(volume) {
            const v = Math.max(0, Math.min(1, volume));
            
            // 优先使用 Web Audio
            if (isWebAudioReady && gainNode) {
                try {
                    gainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.1);
                    return;
                } catch (e) {}
            }
            
            // 降级使用 HTML5 volume
            try {
                bgMusic.volume = v;
            } catch (e) {}
        }

        function ensureAudioContext() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }

        // ===== 爱心特效 =====
        function burstHearts(count = 60) {
            const container = document.getElementById('heartContainer');
            const colors = ['#d63e6b', '#e8436e', '#f28b9e', '#ffb3c6', '#f7a1b8', '#ff8da1', '#ff6b8a'];
            const heartSizes = [24, 30, 36, 42, 50];

            for (let i = 0; i < count; i++) {
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart floating-heart';
                const size = heartSizes[Math.floor(Math.random() * heartSizes.length)];
                heart.style.fontSize = size + 'px';
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                heart.style.left = (Math.random() * 92 + 4) + '%';
                heart.style.top = (Math.random() * 92 + 4) + '%';
                heart.style.animationDuration = (0.7 + Math.random() * 0.4) + 's';
                heart.style.animationDelay = (Math.random() * 0.2) + 's';
                heart.style.transform = `rotate(${Math.random() * 360}deg)`;
                container.appendChild(heart);

                setTimeout(() => {
                    if (heart.parentNode) heart.remove();
                }, 1200);
            }
        }

        // ===== 进度条 =====
        function startProgressBar() {
            let startTime = Date.now();
            if (progressInterval) clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                let progress = Math.min((elapsed / LOADING_DURATION) * 100, 100);
                if (progress > 99) progress = 100;
                
                progressBarOverlay.style.width = progress + '%';
                progressText.textContent = `加载中 ${Math.round(progress)}%`;

                if (progress >= 100) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                    setTimeout(() => {
                        readyModal.classList.add('show');
                        burstHearts(50);
                    }, 300);
                }
            }, 50);
        }

        // ===== 自动轮播 =====
        function startAutoPlay() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            autoPlayInterval = setInterval(() => {
                updateDisplay((currentIndex + 1) % TOTAL);
                burstHearts(35);
            }, AUTO_INTERVAL_MS);
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
        }

        // ===== 播放音频（带加载等待） =====
        function playAudioSafely(audioElement, onSuccess, onError) {
            // 如果音频还没加载好，等待一下
            if (audioElement.readyState < 2) {
                audioElement.addEventListener('canplaythrough', function onReady() {
                    audioElement.removeEventListener('canplaythrough', onReady);
                    audioElement.play().then(onSuccess).catch(onError);
                });
                // 超时保护
                setTimeout(() => {
                    audioElement.play().then(onSuccess).catch(onError);
                }, 3000);
                return;
            }
            
            audioElement.currentTime = 0;
            audioElement.play().then(onSuccess).catch(onError);
        }

        // ===== 进入主页面 =====
        function enterMainPage() {
            if (isStarted) return;
            isStarted = true;
            debugLog('🚪 进入主页面');

            // 初始化 Web Audio（延迟到用户点击后）
            initWebAudio();

            readyModal.classList.remove('show');

            for (let i = 0; i < 3; i++) {
                setTimeout(() => burstHearts(80), i * 150);
            }

            mainCard.style.display = 'block';
            startAutoPlay();

            // ===== 播放背景音乐 =====
            debugLog('🎵 播放背景音乐');
            musicLabel.textContent = '加载中...';
            bgMusic.loop = true;
            bgMusic.volume = MUSIC_VOLUME_NORMAL;

            // 确保 Web Audio 连接
            if (isWebAudioReady && !musicSource) {
                connectMusicToWebAudio();
            }

            playAudioSafely(
                bgMusic,
                function() {
                    isMusicPlaying = true;
                    musicLabel.textContent = '播放中';
                    setMusicVolume(MUSIC_VOLUME_NORMAL);
                    debugLog('✅ 音乐播放成功');
                },
                function(error) {
                    debugLog('⚠️ 音乐播放失败: ' + error.message);
                    musicLabel.textContent = '点击播放';
                }
            );

            // ===== 自动播放录音 =====
            debugLog('🎙️ 播放录音');
            voiceLabel.textContent = '加载中...';
            voiceBtn.disabled = true;

            playAudioSafely(
                voiceRecord,
                function() {
                    isVoicePlaying = true;
                    voiceLabel.textContent = '停止';
                    voiceBtn.classList.add('recording');
                    voiceBtn.disabled = false;
                    if (isMusicPlaying) {
                        setMusicVolume(MUSIC_VOLUME_LOW);
                        debugLog(`🔊 音量降至 ${Math.round(MUSIC_VOLUME_LOW * 100)}%`);
                    }
                    debugLog('✅ 录音播放成功');
                },
                function(error) {
                    debugLog('⚠️ 录音播放失败: ' + error.message);
                    voiceLabel.textContent = '听录音';
                    voiceBtn.disabled = false;
                }
            );

            startOverlay.classList.add('hidden');
            setTimeout(() => burstHearts(100), 400);
        }

        // ===== 重新加载 =====
        function reloadPage() {
            debugLog('🔄 重新加载');
            readyModal.classList.remove('show');
            progressBarOverlay.style.width = '0%';
            progressText.textContent = '加载中 0%';
            startProgressBar();
            preloadAllImages();
            
            bgMusic.pause();
            bgMusic.currentTime = 0;
            voiceRecord.pause();
            voiceRecord.currentTime = 0;
            isVoicePlaying = false;
            voiceLabel.textContent = '听录音';
            voiceBtn.classList.remove('recording');
            voiceBtn.disabled = false;
            musicLabel.textContent = '加载中...';
            isMusicPlaying = false;
            isStarted = false;
            isWebAudioReady = false;
            musicSource = null;
            if (audioCtx) {
                try { audioCtx.close(); } catch(e) {}
                audioCtx = null;
                gainNode = null;
            }
        }

        // ===== 音乐开关 =====
        function toggleMusic() {
            if (bgMusic.paused) {
                ensureAudioContext();
                if (isWebAudioReady && !musicSource) {
                    connectMusicToWebAudio();
                }
                bgMusic.volume = isVoicePlaying ? MUSIC_VOLUME_LOW : MUSIC_VOLUME_NORMAL;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicLabel.textContent = '播放中';
                }).catch(() => {
                    musicLabel.textContent = '点击播放';
                });
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                musicLabel.textContent = '已暂停';
            }
            burstHearts(40);
        }

        // ===== 录音控制 =====
        voiceBtn.addEventListener('click', function() {
            if (isVoicePlaying) {
                voiceRecord.pause();
                voiceRecord.currentTime = 0;
                isVoicePlaying = false;
                voiceLabel.textContent = '听录音';
                voiceBtn.classList.remove('recording');
                if (isMusicPlaying) {
                    setMusicVolume(MUSIC_VOLUME_NORMAL);
                }
            } else {
                voiceLabel.textContent = '加载中...';
                voiceBtn.disabled = true;
                ensureAudioContext();
                
                voiceRecord.play().then(() => {
                    isVoicePlaying = true;
                    voiceLabel.textContent = '停止';
                    voiceBtn.classList.add('recording');
                    voiceBtn.disabled = false;
                    if (isMusicPlaying) {
                        setMusicVolume(MUSIC_VOLUME_LOW);
                    }
                }).catch((error) => {
                    voiceLabel.textContent = '听录音';
                    voiceBtn.disabled = false;
                    alert('录音文件加载失败，请确认音频文件已上传');
                });
            }
        });

        voiceRecord.addEventListener('ended', function() {
            isVoicePlaying = false;
            voiceLabel.textContent = '听录音';
            voiceBtn.classList.remove('recording');
            voiceBtn.disabled = false;
            if (isMusicPlaying) {
                setMusicVolume(MUSIC_VOLUME_NORMAL);
            }
        });

        // ===== 预加载图片 =====
        function preloadAllImages() {
            let loadedCount = 0;
            for (let i = 0; i < TOTAL; i++) {
                const img = new Image();
                img.onload = function() { loadedCount++; };
                img.onerror = function() { loadedCount++; };
                img.src = getPhotoUrl(i);
            }
        }

        // ===== 更新显示 =====
        function updateDisplay(index) {
            if (index < 0) index = 0;
            if (index >= TOTAL) index = TOTAL - 1;
            currentIndex = index;

            photoContainer.classList.add('loading');
            
            const img = new Image();
            img.onload = function() {
                mainPhoto.src = getPhotoUrl(index);
                mainPhoto.style.animation = 'none';
                void mainPhoto.offsetHeight;
                mainPhoto.style.animation = 'fadeIn 0.7s ease';
                photoContainer.classList.remove('loading');
            };
            img.onerror = function() {
                mainPhoto.src = getPhotoUrl(index);
                photoContainer.classList.remove('loading');
            };
            img.src = getPhotoUrl(index);

            numberDisplay.textContent = `${index + 1} / ${TOTAL}`;
            quoteText.innerHTML = loveMessages[index] || "你是我最想珍惜的人 💖";

            const percent = ((index + 1) / TOTAL) * 100;
            progressFill.style.width = `${percent}%`;
            progressLabel.textContent = `${index + 1}/${TOTAL}`;
        }

        function prevPhoto() {
            stopAutoPlay();
            updateDisplay((currentIndex - 1 + TOTAL) % TOTAL);
            startAutoPlay();
            burstHearts(55);
        }

        function nextPhoto() {
            stopAutoPlay();
            updateDisplay((currentIndex + 1) % TOTAL);
            startAutoPlay();
            burstHearts(55);
        }

        function shufflePhoto() {
            stopAutoPlay();
            updateDisplay(Math.floor(Math.random() * TOTAL));
            startAutoPlay();
            burstHearts(70);
        }

        function resetToFirst() {
            stopAutoPlay();
            updateDisplay(0);
            startAutoPlay();
            burstHearts(60);
        }

        function handlePhotoClick() {
            burstHearts(65);
        }

        // ===== 初始化 =====
        function init() {
            debugLog('🔧 初始化');
            updateDisplay(0);
            preloadAllImages();
            startProgressBar();
            
            readyYes.addEventListener('click', enterMainPage);
            readyNo.addEventListener('click', reloadPage);

            setTimeout(() => burstHearts(35), 500);
        }

        // ===== 绑定事件 =====
        prevBtn.addEventListener('click', prevPhoto);
        nextBtn.addEventListener('click', nextPhoto);
        shuffleBtn.addEventListener('click', shufflePhoto);
        resetBtn.addEventListener('click', resetToFirst);
        musicToggle.addEventListener('click', toggleMusic);
        photoContainer.addEventListener('click', handlePhotoClick);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); prevPhoto(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); nextPhoto(); }
        });

        mainPhoto.addEventListener('error', function() {
            if (this.parentNode.querySelector('.placeholder-icon')) return;
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder-icon';
            placeholder.innerHTML = '<i class="fas fa-heart" style="font-size: 3.5rem; opacity: 0.6;"></i>';
            this.style.display = 'none';
            this.parentNode.appendChild(placeholder);
        });

        init();

        window.addEventListener('beforeunload', function() {
            if (autoPlayInterval) clearInterval(autoPlayInterval);
            if (progressInterval) clearInterval(progressInterval);
            if (audioCtx) {
                try { audioCtx.close(); } catch(e) {}
            }
        });
    })();
