<!DOCTYPE html>
<html lang="zh-CN">
<head>

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
            overflow-x: hidden;
        }
        .card {
            max-width: 660px;
            width: 100%;
            background: rgba(255, 240, 245, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 64px 64px 48px 48px;
            padding: 24px 24px 36px;
            box-shadow: 0 30px 80px rgba(180, 60, 100, 0.25), 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 200, 210, 0.6);
            position: relative;
            z-index: 1;
        }
        .header { text-align: center; margin-bottom: 18px; }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #7a2a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;

            justify-content: center;
            align-items: center;
            margin: 8px auto;
            width: 100%;

        .photo-container {
            width: 100%;
            height: 100%;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 16px 48px rgba(160, 50, 80, 0.25);
            background: #ffeef2;
            position: relative;
            cursor: pointer;
        }
        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .photo-badge {
            position: absolute;
            bottom: 16px;
            right: 18px;
            background: rgba(255, 235, 240, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 22px 8px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #7a2a4a;
            border: 1px solid rgba(255, 200, 210, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(180, 60, 100, 0.12);
            z-index: 3;
            white-space: nowrap;
        }
        .photo-badge i { color: #d63e6b; }
        .quote-box {

            max-width: 520px;
            margin: 22px auto 0;
            background: rgba(255, 240, 245, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 200, 210, 0.5);
            box-shadow: inset 0 2px 20px rgba(255, 200, 220, 0.2);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: 0.25s;
        }
        .quote-box i {
            color: #d63e6b;
            font-size: 1.6rem;
            margin-right: 14px;
            animation: pulse-heart 1.8s infinite;
        }
        .quote-box .quote-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #4a1f33;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }
        .quote-box .quote-text .highlight {
            background: linear-gradient(120deg, #f7a1b8, #f28b9e);
            padding: 2px 16px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            margin: 0 4px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }
        .progress-area {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 400px;
        }
        .progress-area span {
            font-size: 0.9rem;
            font-weight: 500;
            color: #7a2a4a;
            min-width: 48px;
            text-align: center;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(200, 120, 140, 0.25);

        .progress-fill {

            width: 0%;
            background: linear-gradient(90deg, #e8436e, #f28b9e);

            flex-wrap: wrap;

            text-shadow: 0 0 30px rgba(214, 62, 107, 0.4);

            0% { transform: scale(0.3) rotate(0deg); opacity: 0; }
            15% { transform: scale(1.1) rotate(10deg); opacity: 1; }
            30% { transform: scale(1) rotate(-5deg); opacity: 1; }
            60% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.8) rotate(20deg); opacity: 0; }
        }
        @media (max-width: 600px) {

            .header h1 { font-size: 1.8rem; }
            .photo-wrapper { max-width: 100%; }
            .photo-container { border-radius: 28px; }

            .quote-box .quote-text { font-size: 1.0rem; }

            .ctrl-btn { padding: 8px 14px; font-size: 0.8rem; gap: 6px; }

        }
        @keyframes pulse-heart {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
        .photo-container img { animation: fadeIn 0.7s ease; }
        @keyframes fadeIn {

            100% { opacity: 1; transform: scale(1); }

        .photo-container .placeholder-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #fcd8e2, #fbc4d2);
            color: #b14b6e;
            font-size: 4rem;
        }

        /* ===== 启动覆盖层 ===== */
        #startOverlay {

            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 200, 210, 0.92);

            flex-direction: column;

            cursor: pointer;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.05);
        }
        #startOverlay .big-heart {
            font-size: 5rem;
            color: #d63e6b;
            animation: pulse-heart 1.5s infinite;
        }
        #startOverlay .title {
            color: #7a2a4a;
            font-size: 2.8rem;
            font-weight: 700;
            margin-top: 16px;
            letter-spacing: 2px;
        }
        
        /* ===== I LOVE YOU FOREVER - 红色心跳文字 ===== */
        #startOverlay .sub {
            color: #ff1744;
            font-size: 2.0rem;
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 3px;
            text-shadow: 0 0 40px rgba(255, 23, 68, 0.4);
            animation: heartbeat-text 1.2s ease-in-out infinite;
            display: inline-block;
        }
        
        /* 心跳动画：放大 + 缩小 + 发光 */
        @keyframes heartbeat-text {
            0% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(255, 23, 68, 0.3);
            }
            14% {
                transform: scale(1.25);
                text-shadow: 0 0 60px rgba(255, 23, 68, 0.7), 0 0 100px rgba(255, 23, 68, 0.3);

            28% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(255, 23, 68, 0.3);
            }
            42% {
                transform: scale(1.2);
                text-shadow: 0 0 50px rgba(255, 23, 68, 0.6), 0 0 80px rgba(255, 23, 68, 0.2);
            }
            56% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(255, 23, 68, 0.3);
            }
            100% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(255, 23, 68, 0.3);
            }
        }

        #startOverlay .hint {
            color: #d63e6b;
            font-size: 1.8rem;
            margin-top: 30px;
            animation: bounce-down 1.5s infinite;
        }
        @keyframes bounce-down {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }
        @media (max-width: 600px) {
            #startOverlay .title { font-size: 2rem; }
            #startOverlay .big-heart { font-size: 3.5rem; }
            #startOverlay .sub { font-size: 1.5rem; }
            #startOverlay .hint { font-size: 1.4rem; }
        }
        @media (max-width: 420px) {
            #startOverlay .sub { font-size: 1.2rem; letter-spacing: 2px; }
        }

        /* ===== 加载状态 ===== */
        .photo-container.loading::after {
            content: '💕 加载中...';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7a2a4a;
            font-size: 1.2rem;
            background: rgba(255, 240, 245, 0.85);

            -webkit-backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 200, 210, 0.5);
            z-index: 2;
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(180, 60, 100, 0.12);
            animation: pulse-heart 1.2s infinite;
        }
    </style>
</head>

        // ----- 爱心特效 -----
        function burstHearts(count = 60) {
            const container = document.getElementById('heartContainer');
            const colors = ['#d63e6b', '#e8436e', '#f28b9e', '#ffb3c6', '#f7a1b8', '#ff8da1', '#ff6b8a'];

            for (let i = 0; i < count; i++) {
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart floating-heart';
                const size = heartSizes[Math.floor(Math.random() * heartSizes.length)];
                heart.style.fontSize = size + 'px';
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];

                setTimeout(() => {

            }

        // ----- 启动（用户点击覆盖层） -----

            isStarted = true;

            bgMusic.loop = true;
            bgMusic.play().then(() => {
                musicReady = true;
                isMusicPlaying = true;
                musicLabel.textContent = '播放中';
                console.log('✅ 音乐播放成功');

        // ----- 音乐开关 -----
        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicReady = true;
                    musicLabel.textContent = '播放中';
                }).catch(() => {});
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                musicLabel.textContent = '已暂停';
            }
            burstHearts(40);
        }

        // ----- 预加载所有图片 -----
        function preloadAllImages() {
            console.log('🔄 开始预加载 ' + TOTAL + ' 张图片...');
            let loadedCount = 0;
            for (let i = 0; i < TOTAL; i++) {
                const img = new Image();
                img.onload = function() {
                    loadedCount++;
                    if (loadedCount === TOTAL) {
                        console.log('✅ 所有图片预加载完成！');
                    }
                };
                img.onerror = function() {
                    loadedCount++;
                    console.warn('⚠️ 图片加载失败: ' + (i + 1) + '.jpg');
                };
                img.src = getPhotoUrl(i);
            }
        }

        // ----- 照片更新 -----
        function updateDisplay(index) {
            if (index < 0) index = 0;
            if (index >= TOTAL) index = TOTAL - 1;
            currentIndex = index;

            // 显示加载状态
            photoContainer.classList.add('loading');
            
            // 预加载当前图片
            const img = new Image();
            img.onload = function() {
                // 图片加载完成，更新 src
                mainPhoto.src = getPhotoUrl(index);
                mainPhoto.style.animation = 'none';
                void mainPhoto.offsetHeight;
                mainPhoto.style.animation = 'fadeIn 0.7s ease';
                photoContainer.classList.remove('loading');
            };
            img.onerror = function() {
                // 加载失败也移除加载状态，显示占位
                mainPhoto.src = getPhotoUrl(index);
                photoContainer.classList.remove('loading');
            };
            img.src = getPhotoUrl(index);

            numberDisplay.textContent = `${index + 1} / ${TOTAL}`;
            quoteText.innerHTML = loveMessages[index] || "你是我最想珍惜的人 💖";

            const percent = ((index + 1) / TOTAL) * 100;
            progressFill.style.width = `${percent}%`;
            progressLabel.textContent = `${index + 1}/${TOTAL}`;
        }

        function prevPhoto() {
            if (isPlaying) togglePlay();
            updateDisplay((currentIndex - 1 + TOTAL) % TOTAL);
            burstHearts(55);
        }

        function nextPhoto() {
            if (isPlaying) togglePlay();
            updateDisplay((currentIndex + 1) % TOTAL);
            burstHearts(55);
        }

        function shufflePhoto() {
            if (isPlaying) togglePlay();
            updateDisplay(Math.floor(Math.random() * TOTAL));
            burstHearts(70);
        }

        function resetToFirst() {
            if (isPlaying) togglePlay();
            updateDisplay(0);
            burstHearts(60);
        }

        function togglePlay() {
            if (isPlaying) {
                clearInterval(playInterval);
                playInterval = null;
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i> 播放';
                playBtn.style.background = '';
                playBtn.style.color = '';
                playBtn.classList.remove('primary');
            } else {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i> 暂停';
                playBtn.style.background = '#d63b63';
                playBtn.style.color = 'white';
                playBtn.classList.add('primary');
                if (currentIndex === TOTAL - 1) updateDisplay(0);
                playInterval = setInterval(() => {
                    updateDisplay((currentIndex + 1) % TOTAL);
                    burstHearts(35);
                }, INTERVAL_MS);
            }
            burstHearts(50);
        }

        function handlePhotoClick() {
            burstHearts(65);
        }

        // ----- 初始化 -----
        function init() {
            updateDisplay(0);
            
            // ===== 预加载所有图片 =====
            preloadAllImages();
            
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i> 播放';
                playBtn.style.background = '';
                playBtn.style.color = '';
                playBtn.classList.remove('primary');
            }
            
            // 绑定启动事件
            startOverlay.addEventListener('click', startApp);
            startOverlay.addEventListener('touchstart', startApp);

            // 先显示爱心
            setTimeout(() => burstHearts(35), 500);
        }

        // ----- 绑定按钮事件 -----
        prevBtn.addEventListener('click', prevPhoto);
        nextBtn.addEventListener('click', nextPhoto);
        playBtn.addEventListener('click', togglePlay);
        shuffleBtn.addEventListener('click', shufflePhoto);
        resetBtn.addEventListener('click', resetToFirst);
        musicToggle.addEventListener('click', toggleMusic);
        photoContainer.addEventListener('click', handlePhotoClick);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); prevPhoto(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); nextPhoto(); }
            else if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); togglePlay(); }
        });

        mainPhoto.addEventListener('error', function() {
            const parent = this.parentNode;
            // 检查是否已存在占位，避免重复添加
            if (parent.querySelector('.placeholder-icon')) return;
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder-icon';
            placeholder.innerHTML = '<i class="fas fa-heart" style="font-size: 3.5rem; opacity: 0.6;"></i>';
            this.style.display = 'none';
            parent.appendChild(placeholder);
        });

        init();

        window.addEventListener('beforeunload', function() {
            if (playInterval) clearInterval(playInterval);
        });
    })();
</script>
</body>
</html>
